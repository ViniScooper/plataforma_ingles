services:
  api:
    build:
      context: ./api_users
      dockerfile: Dockerfile
    container_name: plataforma_ingles_api
    restart: unless-stopped
    ports:
      - "3003:3002"
    env_file:
      - ./api_users/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
