<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Gradientes Principais -->
    <linearGradient id="goldMetallic" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="35%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="cosmicPurple" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <linearGradient id="shieldFacetLeft" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="shieldFacetRight" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="textQuestGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Filtros de Brilho e Sombra 3D -->
    <filter id="epicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-color="#00e5ff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ==================== BRASÃO / EMBLEMA HEROICO ==================== -->
  <g filter="url(#softShadow)" transform="translate(4, 0)">
    <!-- Asas Estilizadas de Sabedoria / Evolução (Esquerda) -->
    <path d="M22 28 C12 32, 6 42, 4 52 C10 49, 18 47, 24 48 C16 53, 10 60, 8 68 C16 63, 24 61, 28 62 L26 38 Z" 
          fill="url(#neonCyan)" opacity="0.85"/>

    <!-- Asas Estilizadas de Sabedoria / Evolução (Direita) -->
    <path d="M68 28 C78 32, 84 42, 86 52 C80 49, 72 47, 66 48 C74 53, 80 60, 82 68 C74 63, 66 61, 62 62 L64 38 Z" 
          fill="url(#neonCyan)" opacity="0.85"/>

    <!-- Escudo Hexagonal Facetado (Face Esquerda) -->
    <path d="M45 10 L20 25 L22 55 L45 78 Z" 
          fill="url(#shieldFacetLeft)" stroke="url(#neonCyan)" stroke-width="1.8"/>

    <!-- Escudo Hexagonal Facetado (Face Direita) -->
    <path d="M45 10 L70 25 L68 55 L45 78 Z" 
          fill="url(#shieldFacetRight)" stroke="url(#neonCyan)" stroke-width="1.8"/>

    <!-- Borda Neon Superior do Escudo -->
    <path d="M20 25 L45 10 L70 25" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Portal Cósmico Central (Anel do Q) -->
    <ellipse cx="45" cy="42" rx="15" ry="17" fill="#070f19" stroke="url(#goldMetallic)" stroke-width="3"/>
    <ellipse cx="45" cy="42" rx="10.5" ry="12" fill="none" stroke="url(#cosmicPurple)" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Cristal Estelar Central (Brilho da Descoberta) -->
    <path d="M45 32 L48 42 L45 52 L42 42 Z" fill="#ffffff" filter="url(#epicGlow)"/>
    <path d="M38 42 L45 40 L52 42 L45 44 Z" fill="#00e5ff" opacity="0.9"/>

    <!-- Espada da Sabedoria (Cauda dinâmica do "Q") -->
    <path d="M52 50 L64 66 L68 64 L56 48 Z" fill="url(#goldMetallic)"/>
    <circle cx="65" cy="65" r="2" fill="#fff" filter="url(#epicGlow)"/>
  </g>

  <!-- ==================== TIPOGRAFIA PREMIUM ==================== -->
  <!-- "QUEST" -->
  <g transform="translate(100, 43)">
    <!-- Efeito de sombra sutil no texto -->
    <text x="1" y="1" 
          font-family="'Montserrat', 'Inter', 'Outfit', sans-serif" 
          font-size="34" 
          font-weight="950" 
          letter-spacing="3" 
          fill="rgba(0, 0, 0, 0.7)">
      QUEST
    </text>
    <text x="0" y="0" 
          font-family="'Montserrat', 'Inter', 'Outfit', sans-serif" 
          font-size="34" 
          font-weight="950" 
          letter-spacing="3" 
          fill="url(#textQuestGrad)">
      QUEST
    </text>
    <!-- Detalhe dourado no topo do Q -->
    <circle cx="2" cy="-24" r="3" fill="url(#goldMetallic)"/>
  </g>

  <!-- "ENGLISH" com visual tecnológico e esportivo -->
  <g transform="translate(102, 68)">
    <text x="0" y="0" 
          font-family="'Montserrat', 'Inter', 'Outfit', sans-serif" 
          font-size="14.5" 
          font-weight="900" 
          letter-spacing="5.5" 
          fill="url(#neonCyan)">
      ENGLISH
    </text>
    
    <!-- Linha decorativa de progresso e nível -->
    <line x1="126" y1="-5" x2="210" y2="-5" stroke="url(#goldMetallic)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="210" cy="-5" r="2" fill="#ffd54f"/>
  </g>
</svg>
