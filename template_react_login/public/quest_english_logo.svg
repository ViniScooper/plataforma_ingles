<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="90" y1="30" x2="320" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="subTextGrad" x1="95" y1="65" x2="280" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#ffd426"/>
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00b4d8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- EMBLEMA / ÍCONE DO LOGO (ESCUDO + BÚSSOLA + LETRA Q) -->
  <g filter="url(#shadowFilter)">
    <!-- Escudo externo -->
    <path d="M45 8 C 65 8, 76 18, 76 38 C 76 62, 53 77, 45 82 C 37 77, 14 62, 14 38 C 14 18, 25 8, 45 8 Z" 
          fill="#07111e" stroke="url(#shieldGrad)" stroke-width="2.5"/>

    <!-- Anel interno da bússola -->
    <circle cx="45" cy="42" r="21" stroke="url(#glowGrad)" stroke-width="1.8" stroke-dasharray="3 2" fill="none"/>

    <!-- Letra Q / Estrela de navegação -->
    <path d="M45 27 L49 38 L60 42 L49 46 L45 57 L41 46 L30 42 L41 38 Z" fill="#ffd426"/>
    <circle cx="45" cy="42" r="3.5" fill="#07111e"/>

    <!-- Detalhe da cauda do Q -->
    <path d="M52 50 L63 61" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- TIPOGRAFIA DO LOGO -->
  <!-- "QUEST" -->
  <text x="96" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif" 
        font-size="32" 
        font-weight="900" 
        letter-spacing="2.5" 
        fill="url(#textGrad)">
    QUEST
  </text>

  <!-- "ENGLISH" -->
  <text x="98" y="66" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="6" 
        fill="url(#subTextGrad)">
    ENGLISH
  </text>

  <!-- Pílula / Badge "EDTECH" -->
  <rect x="255" y="24" width="62" height="18" rx="9" fill="rgba(0, 180, 216, 0.15)" stroke="rgba(0, 180, 216, 0.4)" stroke-width="1"/>
  <text x="286" y="36.5" 
        font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8.5" 
        font-weight="800" 
        letter-spacing="1.2" 
        fill="#00b4d8" 
        text-anchor="middle">
    PORTAL
  </text>
</svg>
